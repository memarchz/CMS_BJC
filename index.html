<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>เลือกบทบาท | SUPPLIER PORTAL</title>
  <script>
    const _twWarn = console.warn;
    console.warn = (...a) => { if (typeof a[0] === 'string' && a[0].includes('cdn.tailwindcss.com')) return; _twWarn(...a); };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: radial-gradient(circle at 50% 25%, #ffffff 0%, #f6fbf7 55%, #eaf5ec 100%);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .sparks {
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.75;
        transform: scale(0.95);
      }
    }
  </style>
</head>

<body class="flex flex-col min-h-screen text-slate-800 antialiased relative">

  <!-- Top Navigation Bar (Nav เรียบร้อย สวยงาม) -->
  <nav
    class="w-full bg-white/95 backdrop-blur-md border-b border-gray-100 shadow-[0_2px_10px_rgba(0,0,0,0.03)] sticky top-0 z-30">
    <div class="w-full px-6 md:px-12 py-4 flex items-center justify-between">

      <!-- Brand Logo with Handshake Icon -->
      <a href="index.html" class="flex items-center gap-2.5 group">
        <img src="img/logo.png" alt="Supplier Portal"
          class="w-8 h-8 object-contain group-hover:scale-105 transition-transform drop-shadow-sm">
        <span
          class="font-bold text-xl text-gray-900 tracking-tight group-hover:text-[#0b6330] transition-colors font-['Prompt']">
          Supplier Portal
        </span>
      </a>

      <!-- Right Action Button -->
      <div>
        <a href="register.html"
          class="inline-flex items-center gap-1.5 text-xs md:text-sm font-semibold text-[#0b6330] hover:text-white bg-green-50 hover:bg-[#0b6330] border border-green-200 px-4 py-2 rounded-full transition-all shadow-sm">
          <span>ลงทะเบียน Supplier</span>
          <span class="text-xs">&rarr;</span>
        </a>
      </div>

    </div>
  </nav>

  <!-- Main Content Centered -->
  <main class="flex-1 flex flex-col items-center justify-center px-4 py-8 relative z-10">
    <div class="w-full max-w-5xl mx-auto text-center">

      <!-- Active Session Alert Pill (ถ้าเข้าสู่ระบบอยู่แล้ว) -->
      <div id="session-banner"
        class="hidden max-w-xl mx-auto mb-6 bg-white/95 backdrop-blur border border-green-300 shadow-md rounded-full px-5 py-2.5 flex items-center justify-between gap-3 text-xs md:text-sm">
        <div class="flex items-center gap-2 truncate">
          <span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse shrink-0"></span>
          <span class="text-gray-600 truncate">เข้าสู่ระบบอยู่ในชื่อ: <strong id="session-user"
              class="text-green-800 font-semibold"></strong></span>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <a id="session-go" href="#"
            class="bg-green-700 hover:bg-green-800 text-white font-medium px-3.5 py-1 rounded-full text-xs shadow-sm transition-colors">หน้าระบบ
            &rarr;</a>
          <button onclick="Auth.logout()"
            class="text-gray-500 hover:text-red-600 hover:bg-red-50 px-2 py-1 rounded-full text-xs transition-colors">ออกจากระบบ</button>
        </div>
      </div>

      <!-- Hero Header Section -->
      <div class="mb-8">
        <div class="relative inline-block">
          <h1 class="font-extrabold text-4xl sm:text-5xl md:text-6xl text-[#0b6330] tracking-wider font-['Prompt']">
            SUPPLIER PORTAL
          </h1>
          <!-- Energy Sparks (3 dashes on top right) -->
          <svg class="sparks absolute -top-3 -right-6 sm:-right-8 w-7 h-7 sm:w-8 sm:h-8 text-[#0b6330]"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round">
            <line x1="8" y1="18" x2="3" y2="23" />
            <line x1="16" y1="14" x2="19" y2="9" />
            <line x1="22" y1="20" x2="16" y2="18" />
          </svg>
        </div>

        <p class="text-gray-600 text-base md:text-lg mt-2 font-medium">
          ระบบรับข้อมูลทรัพย์สินและเครื่องจักรจาก Supplier
        </p>

        <!-- Centered Green Pill Bar -->
        <div class="w-14 h-1.5 bg-[#0b6330] rounded-full mx-auto mt-3"></div>
      </div>

      <!-- 3 Centered Role Cards -->
      <div class="grid sm:grid-cols-3 gap-6 max-w-4xl mx-auto my-4">

        <!-- Card 1: Supplier -->
        <a href="login.html?role=supplier" onclick="selectRole('supplier', event)"
          class="group bg-white rounded-3xl p-7 border border-gray-100 shadow-[0_10px_25px_rgba(0,0,0,0.05)] hover:shadow-[0_20px_35px_rgba(11,99,48,0.12)] hover:-translate-y-1.5 transition-all duration-300 flex flex-col items-center justify-between text-center cursor-pointer block no-underline">
          <div class="flex flex-col items-center">
            <div class="w-28 h-28 mb-3 flex items-center justify-center">
              <img src="img/supplier.png" alt="Supplier"
                class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-300">
            </div>
            <h2 class="font-bold text-xl text-gray-900 group-hover:text-[#0b6330] transition-colors">
              Supplier
            </h2>
          </div>
          <div
            class="mt-6 w-full sm:w-auto px-7 py-2.5 rounded-full bg-[#eaf6ec] group-hover:bg-[#0b6330] text-[#0b6330] group-hover:text-white font-semibold text-sm transition-all duration-200 border border-[#c5e6cb] shadow-sm inline-flex items-center justify-center gap-1.5">
            <span>เข้าสู่ระบบ Supplier</span>
            <span class="text-base leading-none">&rarr;</span>
          </div>
        </a>

        <!-- Card 2: Buyer -->
        <a href="login.html?role=buyer" onclick="selectRole('buyer', event)"
          class="group bg-white rounded-3xl p-7 border border-gray-100 shadow-[0_10px_25px_rgba(0,0,0,0.05)] hover:shadow-[0_20px_35px_rgba(11,99,48,0.12)] hover:-translate-y-1.5 transition-all duration-300 flex flex-col items-center justify-between text-center cursor-pointer block no-underline">
          <div class="flex flex-col items-center">
            <div class="w-28 h-28 mb-3 flex items-center justify-center">
              <img src="img/buyer.png" alt="Buyer"
                class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-300">
            </div>
            <h2 class="font-bold text-xl text-gray-900 group-hover:text-[#0b6330] transition-colors">
              Buyer
            </h2>
          </div>
          <div
            class="mt-6 w-full sm:w-auto px-7 py-2.5 rounded-full bg-[#eaf6ec] group-hover:bg-[#0b6330] text-[#0b6330] group-hover:text-white font-semibold text-sm transition-all duration-200 border border-[#c5e6cb] shadow-sm inline-flex items-center justify-center gap-1.5">
            <span>เข้าสู่ระบบ Buyer</span>
            <span class="text-base leading-none">&rarr;</span>
          </div>
        </a>

        <!-- Card 3: Admin -->
        <a href="login.html?role=admin" onclick="selectRole('admin', event)"
          class="group bg-white rounded-3xl p-7 border border-gray-100 shadow-[0_10px_25px_rgba(0,0,0,0.05)] hover:shadow-[0_20px_35px_rgba(11,99,48,0.12)] hover:-translate-y-1.5 transition-all duration-300 flex flex-col items-center justify-between text-center cursor-pointer block no-underline">
          <div class="flex flex-col items-center">
            <div class="w-28 h-28 mb-3 flex items-center justify-center">
              <img src="img/admin.png" alt="Admin"
                class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-300">
            </div>
            <h2 class="font-bold text-xl text-gray-900 group-hover:text-[#0b6330] transition-colors">
              Admin
            </h2>
          </div>
          <div
            class="mt-6 w-full sm:w-auto px-7 py-2.5 rounded-full bg-[#eaf6ec] group-hover:bg-[#0b6330] text-[#0b6330] group-hover:text-white font-semibold text-sm transition-all duration-200 border border-[#c5e6cb] shadow-sm inline-flex items-center justify-center gap-1.5">
            <span>เข้าสู่ระบบ Admin</span>
            <span class="text-base leading-none">&rarr;</span>
          </div>
        </a>

      </div>

      <!-- Registration Footer link -->
      <p class="text-center text-xs md:text-sm text-gray-600 mt-6 relative z-10">
        Supplier รายใหม่?
        <a href="register.html" class="text-[#0b6330] font-bold hover:underline ml-1">ลงทะเบียนที่นี่</a>
      </p>

    </div>
  </main>



  <script src="js/common.js"></script>
  <script>
    function selectRole(role, e) {
      sessionStorage.setItem('selected_role', role);
      localStorage.setItem('selected_role', role);
    }

    // แสดงแบนเนอร์แจ้งสถานะ session ปัจจุบัน (ไม่ redirect ดักคอ เพื่อให้เลือกเปลี่ยนบทบาทได้ตามใจชอบ)
    const s = Auth.session();
    if (s) {
      const banner = E('session-banner');
      if (banner) {
        banner.classList.remove('hidden');
        E('session-user').textContent = s.name + ' (' + (RL[s.role] ? RL[s.role][1] : s.role) + ')';
        E('session-go').href = Auth.home(s.role);
      }
    }
  </script>
</body>

</html>
