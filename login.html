<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>เข้าสู่ระบบ | SUPPLIER PORTAL</title>
  <script>
    const _twWarn = console.warn;
    console.warn = (...a) => { if (typeof a[0] === 'string' && a[0].includes('cdn.tailwindcss.com')) return; _twWarn(...a); };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: radial-gradient(circle at 50% 20%, #ffffff 0%, #f6fbf7 60%, #eef7f0 100%);
      min-height: 100vh;
    }
  </style>
</head>

<body class="flex flex-col min-h-screen text-slate-800 antialiased relative">

  <!-- Top Navigation Bar -->
  <header class="w-full px-6 md:px-12 py-4 flex items-center justify-between relative z-20">
    <a href="index.html" class="flex items-center gap-2.5 group">
      <img src="img/logo.png" alt="Supplier Portal"
        class="w-8 h-8 object-contain group-hover:scale-105 transition-transform drop-shadow-sm">
      <span class="font-bold text-xl text-gray-900 tracking-tight">Supplier Portal</span>
    </a>


  </header>

  <!-- Login Card Centered -->
  <main class="flex-1 flex items-center justify-center p-5 relative z-10">
    <form id="f"
      class="w-full max-w-md bg-white rounded-3xl shadow-[0_15px_35px_rgba(0,0,0,0.06)] border border-gray-100 p-8"
      autocomplete="off">

      <div class="flex items-center justify-between mb-4">
        <a href="index.html"
          class="text-sm text-gray-500 hover:text-[#0b6330] inline-flex items-center gap-1.5 transition-colors font-medium">
          &larr; กลับหน้าเลือกบทบาท
        </a>
        <span id="role-badge" class="text-xs px-3 py-1 rounded-full font-semibold"></span>
      </div>

      <div class="brand text-2xl font-bold tracking-wide mt-2 text-[#0b6330]">SUPPLIER PORTAL</div>
      <h1 id="login-title" class="text-2xl font-bold mt-1 text-gray-900">เข้าสู่ระบบ</h1>
      <p id="l-role" class="text-sm text-gray-500 mb-4 font-medium"></p>

      <!-- Role Switcher Tabs (3 Clean Tabs) -->
      <div class="grid grid-cols-3 gap-1 bg-gray-100 p-1 rounded-2xl mb-4">
        <button type="button" onclick="switchRole('supplier')" id="tab-supplier"
          class="py-2 text-xs sm:text-sm font-semibold rounded-xl transition-all">Supplier</button>
        <button type="button" onclick="switchRole('buyer')" id="tab-buyer"
          class="py-2 text-xs sm:text-sm font-semibold rounded-xl transition-all">Buyer</button>
        <button type="button" onclick="switchRole('admin')" id="tab-admin"
          class="py-2 text-xs sm:text-sm font-semibold rounded-xl transition-all">Admin</button>
      </div>

      <!-- Quick Buyer Switcher for Demo (แสดงเมื่อเลือกแท็บ Buyer) -->
      <div id="buyer-demo-pills" class="hidden mb-4 p-3 bg-emerald-50/80 border border-emerald-200 rounded-2xl text-xs">
        <div class="text-gray-600 font-semibold mb-2 flex items-center justify-between">
          <span>เลือกบัญชี Buyer ทดสอบ (สิทธิ์ Category ต่างกัน):</span>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="setBuyerDemo('buyer@demo.co.th')" id="btn-b1"
            class="p-2.5 rounded-xl border bg-white text-left transition-all border-emerald-500 shadow-xs">
            <div class="font-bold text-emerald-900">Buyer 1</div>
            <div class="text-[10px] text-emerald-700 font-medium">สิทธิ์: เครื่องเย็น & HVAC</div>
          </button>
          <button type="button" onclick="setBuyerDemo('buyer2@demo.co.th')" id="btn-b2"
            class="p-2.5 rounded-xl border bg-white text-left transition-all border-gray-200 hover:border-emerald-300">
            <div class="font-bold text-gray-800">Buyer 2</div>
            <div class="text-[10px] text-gray-500 font-medium">สิทธิ์: ไฟฟ้า & ความปลอดภัย</div>
          </button>
        </div>
      </div>

      <!-- Form Inputs -->
      <label class="text-sm font-medium text-gray-700 block mb-1">อีเมล</label>
      <input id="l-mail" type="email" required class="inp mb-4" placeholder="email@company.com" autocomplete="off">

      <label class="text-sm font-medium text-gray-700 block mb-1">รหัสผ่าน</label>
      <div class="relative mb-4">
        <input id="l-pw" type="password" required class="inp pr-16" placeholder="กรอกรหัสผ่าน"
          autocomplete="new-password">
        <button type="button"
          onclick="const p=E('l-pw');p.type=p.type=='password'?'text':'password';this.textContent=p.type=='password'?'แสดง':'ซ่อน'"
          class="absolute right-3.5 top-2.5 text-sm text-[#0b6330] font-medium hover:underline">แสดง</button>
      </div>

      <p id="err" class="hidden text-sm text-red-600 mb-4 bg-red-50 p-3 rounded-xl border border-red-200">
        อีเมลหรือรหัสผ่านไม่ถูกต้อง</p>

      <button id="btn-submit"
        class="w-full bg-[#0b6330] hover:bg-[#084d25] text-white font-semibold rounded-xl py-3.5 transition-all shadow-md hover:shadow-lg">
        เข้าสู่ระบบ
      </button>

      <p id="reg" class="hidden text-sm text-center text-gray-600 mt-5">
        ยังไม่มีบัญชี? <a href="register.html" class="text-[#0b6330] font-semibold hover:underline">ลงทะเบียน
          Supplier</a>
      </p>

    </form>
  </main>

  <script src="js/common.js?v=20261001_5"></script>
  <script src="js/login.js?v=20261001_5"></script>
</body>

</html>
